<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Strawberry Music — your music, beautifully organized.">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="img/strawberry-180.png?v=2">
<meta name="apple-mobile-web-app-title" content="Strawberry Music">
<title>Strawberry Music</title>
<script>
  (function () {
    try {
      var theme = localStorage.getItem("strawberry.theme") === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#101014" : "#ffffff");
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/strawberry.css">
<link rel="stylesheet" href="css/theme-dark.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16"/><path d="M9 4v16"/><path d="m14 5 6 14"/></symbol>
  <symbol id="i-playlist" viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7"/><path d="M18 11v8"/><path d="M15 14h6"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16Z"/><path d="M5 19V5"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8V4Z"/><path d="M19 5v14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10.5 12.5 10v5"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
  <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6M21 9l-5 6"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h12M3 11h12M3 16h8"/><path d="M18 9v9"/><circle cx="18" cy="20" r="2"/></symbol>
  <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/><path d="M8 9h8M8 12h5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.7l6.2-.9L12 3Z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></symbol>
</svg>

<div class="app" id="app">

  <!-- ==================== SIDEBAR ==================== -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/home" aria-label="Strawberry Music home">
      <span class="brand-mark">
        <img src="img/strawberry.png?v=2" alt="">
      </span>
      <span class="brand-name">Strawberry <em>Music</em></span>
    </a>

    <button class="search-pill" data-nav="search" aria-label="Search">
      <svg class="icon"><use href="#i-search"/></svg>
      <span>Search songs, albums, artists</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="side-nav" aria-label="Main">
      <a href="#/home" data-nav-link="home">
        <svg class="icon"><use href="#i-home"/></svg><span>Home</span>
      </a>
      <a href="#/explore" data-nav-link="explore">
        <svg class="icon"><use href="#i-compass"/></svg><span>Explore</span>
        <span class="pill-new">New</span>
      </a>
    </nav>

    <div class="side-group">
      <div class="side-label">Library</div>
      <a href="#/recent" data-nav-link="recent"><svg class="icon"><use href="#i-clock"/></svg><span>Recently Played</span></a>
      <a href="#/artists" data-nav-link="artists"><svg class="icon"><use href="#i-mic"/></svg><span>Artists</span></a>
      <a href="#/albums" data-nav-link="albums"><svg class="icon"><use href="#i-disc"/></svg><span>Albums</span></a>
      <a href="#/liked" data-nav-link="liked"><svg class="icon"><use href="#i-heart"/></svg><span>Songs</span></a>
      <a href="#/made" data-nav-link="made"><svg class="icon"><use href="#i-sparkle"/></svg><span>Made For You</span></a>
    </div>

    <div class="side-group">
      <div class="side-label">
        Playlists
        <button class="mini-btn" data-action="create-playlist" aria-label="Create playlist">
          <svg class="icon"><use href="#i-plus"/></svg>
        </button>
      </div>
      <a href="#/playlists" data-nav-link="playlists"><svg class="icon"><use href="#i-library"/></svg><span>All Playlists</span></a>
      <a href="#/liked" data-nav-link="liked-playlists"><svg class="icon"><use href="#i-heart"/></svg><span>Liked Music</span></a>
      <div id="sidePlaylists"></div>
    </div>

    <div class="side-spacer"></div>

    <div class="side-footer">
      <button class="profile" data-action="settings">
        <span class="avatar">L</span>
        <span class="profile-meta"><strong>Listener</strong><small>Local library</small></span>
      </button>
      <button class="icon-btn" data-action="settings" aria-label="Settings">
        <svg class="icon"><use href="#i-settings"/></svg>
      </button>
    </div>
  </aside>

  <!-- ==================== MOBILE TOP BAR ==================== -->
  <header class="topbar" id="topbar">
    <button class="icon-btn" data-action="toggle-sidebar" aria-label="Menu">
      <svg class="icon"><use href="#i-menu"/></svg>
    </button>
    <a class="brand brand-sm" href="#/home">
      <span class="brand-mark">
        <img src="img/strawberry.png?v=2" alt="">
      </span>
      <span class="brand-name">Strawberry <em>Music</em></span>
    </a>
    <button class="icon-btn" data-nav="search" aria-label="Search">
      <svg class="icon"><use href="#i-search"/></svg>
    </button>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main class="main" id="main" tabindex="-1"></main>

  <!-- ==================== PLAYER BAR ==================== -->
  <footer class="player" id="player">
    <div class="player-left">
      <button class="player-art art" id="pArt" data-player="expand" aria-label="Open now playing">
        <img id="pImg" alt="">
      </button>
      <div class="player-meta" data-player="expand" role="button" tabindex="0" title="Open now playing">
        <div class="player-title" id="pTitle">Nothing playing</div>
        <div class="player-artist" id="pArtist">Pick a song to start</div>
      </div>
      <button class="icon-btn like-btn" id="pLike" data-action="like-current" aria-label="Like song">
        <svg class="icon"><use href="#i-heart"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="pc-controls">
        <button class="icon-btn" data-player="shuffle" id="pShuffle" aria-label="Shuffle" title="Shuffle">
          <svg class="icon"><use href="#i-shuffle"/></svg>
        </button>
        <button class="icon-btn" data-player="prev" aria-label="Previous" title="Previous">
          <svg class="icon fill"><use href="#i-prev"/></svg>
        </button>
        <button class="pc-play" data-player="toggle" id="pPlay" aria-label="Play" title="Play / pause">
          <svg class="icon fill icon-play"><use href="#i-play"/></svg>
          <svg class="icon fill icon-pause"><use href="#i-pause"/></svg>
          <span class="buffering"></span>
        </button>
        <button class="icon-btn" data-player="next" aria-label="Next" title="Next">
          <svg class="icon fill"><use href="#i-next"/></svg>
        </button>
        <button class="icon-btn" data-player="repeat" id="pRepeat" aria-label="Repeat" title="Repeat">
          <svg class="icon"><use href="#i-repeat"/></svg>
        </button>
      </div>
      <div class="pc-seek">
        <span class="time" id="pCur">0:00</span>
        <input class="range seek" id="pSeek" type="range" min="0" max="1000" value="0" aria-label="Seek">
        <span class="time" id="pDur">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn" data-player="lyrics" aria-label="Lyrics" title="Lyrics">
        <svg class="icon"><use href="#i-lyrics"/></svg>
      </button>
      <button class="icon-btn queue-btn" data-player="queue" aria-label="Queue" title="Queue">
        <svg class="icon"><use href="#i-queue"/></svg>
        <span class="qcount" id="qCount"></span>
      </button>
      <div class="volume">
        <button class="icon-btn" data-player="mute" id="pMute" aria-label="Mute" title="Mute">
          <svg class="icon icon-vol"><use href="#i-volume"/></svg>
          <svg class="icon icon-mute"><use href="#i-volume-off"/></svg>
        </button>
        <input class="range vol" id="pVol" type="range" min="0" max="100" value="85" aria-label="Volume">
      </div>
      <button class="icon-btn" data-player="expand" aria-label="Full screen" title="Full screen">
        <svg class="icon"><use href="#i-expand"/></svg>
      </button>
    </div>
  </footer>

  <!-- ==================== QUEUE DRAWER ==================== -->
  <aside class="queue-panel" id="queuePanel" aria-hidden="true">
    <header class="queue-head">
      <div>
        <h3>Queue</h3>
        <p id="queueSub">Nothing queued</p>
      </div>
      <div class="queue-actions">
        <button class="icon-btn" data-action="clear-queue" title="Clear queue" aria-label="Clear queue">
          <svg class="icon"><use href="#i-trash"/></svg>
        </button>
        <button class="icon-btn" data-action="close-queue" title="Close" aria-label="Close queue">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <div class="queue-body" id="queueBody"></div>
  </aside>

  <!-- ==================== FULL SCREEN NOW PLAYING ==================== -->
  <section class="np" id="np" aria-hidden="true">
    <div class="np-bg" id="npBg"></div>
    <div class="np-tint"></div>
    <div class="np-accent"></div>

    <header class="np-head">
      <button class="icon-btn" data-player="collapse" aria-label="Close now playing">
        <svg class="icon"><use href="#i-close"/></svg>
      </button>
      <div class="np-head-label">
        <span>Now playing</span>
        <strong id="npContext">Strawberry Music</strong>
      </div>
      <button class="icon-btn" data-player="collapse" aria-label="Collapse">
        <svg class="icon"><use href="#i-collapse"/></svg>
      </button>
    </header>

    <div class="np-body">
      <div class="np-left">
        <div class="np-art art" id="npArt">
          <img id="npImg" alt="">
        </div>

        <div class="np-title-row">
          <div class="np-titles">
            <h2 id="npTitle">Nothing playing</h2>
            <a id="npArtist" href="#/home">Strawberry Music</a>
          </div>
          <div class="np-title-actions">
            <button class="icon-btn like-btn" id="npLike" data-action="like-current" aria-label="Like song">
              <svg class="icon"><use href="#i-heart"/></svg>
            </button>
            <button class="icon-btn" data-action="current-menu" aria-label="More options">
              <svg class="icon"><use href="#i-more"/></svg>
            </button>
          </div>
        </div>

        <div class="np-progress">
          <input class="range seek" id="npSeek" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <div class="np-times">
            <span id="npCur">0:00</span>
            <span id="npDur">0:00</span>
          </div>
        </div>

        <div class="np-controls">
          <button class="icon-btn" data-player="shuffle" id="npShuffle" aria-label="Shuffle">
            <svg class="icon"><use href="#i-shuffle"/></svg>
          </button>
          <button class="icon-btn np-skip" data-player="prev" aria-label="Previous">
            <svg class="icon fill"><use href="#i-prev"/></svg>
          </button>
          <button class="np-play" data-player="toggle" id="npPlay" aria-label="Play">
            <svg class="icon fill icon-play"><use href="#i-play"/></svg>
            <svg class="icon fill icon-pause"><use href="#i-pause"/></svg>
            <span class="buffering"></span>
          </button>
          <button class="icon-btn np-skip" data-player="next" aria-label="Next">
            <svg class="icon fill"><use href="#i-next"/></svg>
          </button>
          <button class="icon-btn" data-player="repeat" id="npRepeat" aria-label="Repeat">
            <svg class="icon"><use href="#i-repeat"/></svg>
          </button>
        </div>
      </div>

      <aside class="np-right">
        <div class="np-tabs" role="tablist">
          <button class="np-tab active" data-np-tab="upnext" role="tab">Up Next</button>
          <button class="np-tab" data-np-tab="lyrics" role="tab">Lyrics</button>
        </div>
        <div class="np-panel" id="npPanel"></div>
      </aside>
    </div>
  </section>

  <!-- ==================== OVERLAYS ==================== -->
  <div class="scrim" id="scrim"></div>
  <div class="menu" id="menu" hidden></div>
  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
